<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinexty Enhancer - AI Image Upscaler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #3B82F6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @-webkit-keyframes spinner {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans flex flex-col items-center p-4">

    <div class="max-w-2xl w-full bg-gray-800 rounded-xl shadow-lg p-6 my-8 border border-gray-700">
        <h1 class="text-3xl font-bold text-center text-blue-400 mb-2">Vinexty Enhancer</h1>
        <p class="text-gray-400 text-center text-sm mb-6">Upscale Gambar Komik & Anime Hingga 4x Menggunakan GPU Accelerator</p>

        <!-- Form Konfigurasi Backend -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-300 mb-2">1. Konfigurasi Backend API Endpoint</label>
            <input type="text" id="apiEndpoint" 
                placeholder="https://xxxx.trycloudflare.com/upscale" 
                class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-blue-500">
            <p class="text-xs text-gray-500 mt-1">*Masukkan URL Cloudflare yang didapat dari Google Colab.</p>
        </div>

        <!-- Form Upload Gambar -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-300 mb-2">2. Pilih Gambar Komik / Anime</label>
            <div class="flex items-center justify-center w-full">
                <label for="imageInput" class="flex flex-col items-center justify-center w-full h-40 border-2 border-gray-600 border-dashed rounded-lg cursor-pointer bg-gray-900 hover:bg-gray-800 border-blue-500">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="mb-2 text-sm text-gray-400"><span class="font-semibold">Klik untuk upload</span> atau seret file ke sini</p>
                        <p class="text-xs text-gray-500">Format yang didukung: PNG, JPG, JPEG, WEBP</p>
                    </div>
                    <input id="imageInput" type="file" accept="image/*" class="hidden" />
                </label>
            </div>
        </div>

        <!-- Tombol Aksi -->
        <button id="processBtn" onclick="startEnhance()" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md flex items-center justify-center">
            Mulai Upscale (4x)
        </button>

        <!-- Indicator Loading -->
        <div id="loading" class="hidden my-6 text-center">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-600 h-10 w-10 mx-auto mb-3"></div>
            <p class="text-blue-400 font-medium animate-pulse">Proses AI Sedang Berjalan di GPU Tesla T4...</p>
        </div>

        <!-- Section Tampilan Hasil -->
        <div id="resultContainer" class="hidden mt-8 border-t border-gray-700 pt-6">
            <h3 class="text-lg font-semibold text-gray-200 mb-4 text-center">Hasil Upscale</h3>
            <div class="overflow-hidden rounded-lg border border-gray-700 mb-4 bg-gray-900 flex justify-center">
                <img id="resultImage" src="" alt="Hasil Upscale" class="max-w-full h-auto rounded-lg">
            </div>
            <a id="downloadBtn" href="" download="upscaled-image.jpg" 
                class="block w-full text-center bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Unduh Gambar HD
            </a>
        </div>
    </div>

    <script>
        // // @audit-gas
        async function startEnhance() {
            const apiEndpointInput = document.getElementById('apiEndpoint').value.trim();
            const imageInput = document.getElementById('imageInput').files[0];
            const processBtn = document.getElementById('processBtn');
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const resultImage = document.getElementById('resultImage');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!apiEndpointInput) {
                alert('Harap masukkan URL Endpoint Backend terlebih dahulu!');
                return;
            }

            if (!imageInput) {
                alert('Harap pilih gambar yang ingin di-upscale!');
                return;
            }

            // Normalisasi URL jika pengguna tidak memasukkan /upscale di akhir
            let targetUrl = apiEndpointInput;
            if (!targetUrl.endsWith('/upscale')) {
                if (targetUrl.endsWith('/')) {
                    targetUrl += 'upscale';
                } else {
                    targetUrl += '/upscale';
                }
            }

            // Tampilkan state loading
            processBtn.disabled = true;
            processBtn.classList.add('opacity-50', 'cursor-not-allowed');
            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                // Konversi gambar ke format Base64
                const base64Image = await convertFileToBase64(imageInput);

                // Kirim request ke Cloudflare Endpoint dengan Bypass Header
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 120000); // Timeout 2 menit

                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true',
                        'bypass-tunnel-reminder': 'true',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        image_base64: base64Image
                    }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP Error ${response.status}: ${errorText || response.statusText}`);
                }

                const data = await response.json();

                if (data.status === 'success' && data.image_base64) {
                    resultImage.src = data.image_base64;
                    downloadBtn.href = data.image_base64;
                    resultContainer.classList.remove('hidden');
                } else {
                    throw new Error('Respon backend tidak memiliki data gambar yang valid.');
                }

            } catch (error) {
                console.error("Detail Error:", error);
                if (error.name === 'AbortError') {
                    alert('Error: Request waktu habis (Timeout). Backend memakan waktu terlalu lama.');
                } else {
                    alert('Error: ' + error.message + '\n\nPastikan Backend Colab masih berjalan dan URL yang dimasukkan benar.');
                }
            } finally {
                processBtn.disabled = false;
                processBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                loading.classList.add('hidden');
            }
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
