<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo & Video Enhancer</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .slider-container {
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    .img-overlay {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      overflow: hidden;
    }
    .slider-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      background: #3b82f6;
      cursor: ew-resize;
      transform: translateX(-50%);
    }
    .slider-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      background: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4">

  <header class="w-full max-w-4xl py-6 text-center border-b border-slate-800 mb-8">
    <h1 class="text-3xl font-bold text-blue-500 mb-2">✨ Vinexty AI Enhancer</h1>
    <p class="text-slate-400 text-sm">Tingkatkan Kualitas Foto secara Gratis berbasis AI</p>
  </header>

  <main class="w-full max-w-4xl space-y-6">
    
    <!-- Config Input API -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
      <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Backend API URL (dari Ngrok / Colab):</label>
      <input type="url" id="apiUrl" placeholder="https://xxxx.ngrok-free.app" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 text-slate-200">
    </div>

    <!-- Upload Box -->
    <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-2xl p-8 text-center bg-slate-800/50 cursor-pointer transition">
      <input type="file" id="fileInput" accept="image/*" class="hidden">
      <div class="space-y-3">
        <div class="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-full flex items-center justify-center mx-auto text-2xl">📸</div>
        <div>
          <p class="font-medium">Klik atau seret foto kamu ke sini</p>
          <p class="text-xs text-slate-500 mt-1">Mendukung format JPG, PNG, WEBP</p>
        </div>
      </div>
    </div>

    <!-- Status Indicator -->
    <div id="statusBox" class="hidden bg-blue-900/30 border border-blue-500/30 p-4 rounded-xl text-center">
      <p id="statusText" class="text-sm font-medium text-blue-300">Memproses media...</p>
    </div>

    <!-- Comparison View -->
    <div id="resultContainer" class="hidden space-y-4">
      <div class="text-center font-medium text-slate-300">Geser slider untuk melihat perbandingan (Sebelum vs Sesudah)</div>
      <div class="slider-container relative w-full h-[400px] md:h-[500px] bg-black rounded-xl overflow-hidden border border-slate-800">
        <!-- Processed / Enhanced Image (After) -->
        <img id="afterImg" class="absolute inset-0 w-full h-full object-contain" src="" alt="Enhanced">
        
        <!-- Original Image (Before) -->
        <div id="imgOverlay" class="img-overlay">
          <img id="beforeImg" class="absolute inset-0 w-full h-full object-contain" src="" alt="Original">
        </div>

        <!-- Slider Line & Button -->
        <div id="sliderHandle" class="slider-handle">
          <div class="slider-button">↔</div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // GANTI 2 BARIS DI BAWAH INI DENGAN KUNCI SUPABASE KAMU
    const SUPABASE_URL = "https://rgycdnvbuwmhjtbiniai.supabase.co";
const SUPABASE_KEY = "sb_publishable_PkiRF33EU33iO1L4w9SEFQ_t3PMHkEd";
    

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const resultContainer = document.getElementById('resultContainer');
    const beforeImg = document.getElementById('beforeImg');
    const afterImg = document.getElementById('afterImg');
    const imgOverlay = document.getElementById('imgOverlay');
    const sliderHandle = document.getElementById('sliderHandle');

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const apiUrl = document.getElementById('apiUrl').value.trim();
      if (!apiUrl) {
        alert("Masukkan URL API Ngrok dari Colab terlebih dahulu!");
        return;
      }

      showStatus("Mengunggah berkas ke storage...");

      try {
        const fileName = `${Date.now()}_${file.name}`;
        const { data, error } = await supabaseClient.storage.from('MEDIA-STORAGE').upload(fileName, file);
        if (error) throw error;

        const originalUrl = `${SUPABASE_URL}/storage/v1/object/public/MEDIA-STORAGE/${fileName}`;
        const { data: job, error: jobErr } = await supabaseClient.from('jobs').insert([{
          original_url: originalUrl,
          media_type: 'image',
          status: 'pending'
        }]).select().single();

        if (jobErr) throw jobErr;

        showStatus("Mengirim job ke GPU Worker Colab...");

        await fetch(`${apiUrl}/process`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            job_id: job.id,
            file_path: fileName,
            media_type: 'image'
          })
        });

        showStatus("AI sedang memproses peningkatan kualitas foto...");

        supabaseClient.channel('custom-filter-channel')
          .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'jobs',
            filter: `id=eq.${job.id}`
          }, (payload) => {
            if (payload.new.status === 'completed') {
              showResult(originalUrl, payload.new.processed_url);
            } else if (payload.new.status === 'failed') {
              showStatus("❌ Pemrosesan gagal di AI Worker.");
            }
          })
          .subscribe();

      } catch (err) {
        alert("Error: " + err.message);
        hideStatus();
      }
    });

    function showStatus(text) {
      statusBox.classList.remove('hidden');
      statusText.innerText = text;
    }

    function hideStatus() {
      statusBox.classList.add('hidden');
    }

    function showResult(beforeUrl, afterUrl) {
      hideStatus();
      beforeImg.src = beforeUrl;
      afterImg.src = afterUrl;
      resultContainer.classList.remove('hidden');
    }

    let isDragging = false;
    const container = document.querySelector('.slider-container');

    sliderHandle.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = container.getBoundingClientRect();
      let x = e.clientX - rect.left;
      if (x < 0) x = 0;
      if (x > rect.width) x = rect.width;
      const percent = (x / rect.width) * 100;
      imgOverlay.style.width = `${percent}%`;
      sliderHandle.style.left = `${percent}%`;
    });

    sliderHandle.addEventListener('touchstart', () => isDragging = true);
    window.addEventListener('touchend', () => isDragging = false);
    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const touch = e.touches[0];
      const rect = container.getBoundingClientRect();
      let x = touch.clientX - rect.left;
      if (x < 0) x = 0;
      if (x > rect.width) x = rect.width;
      const percent = (x / rect.width) * 100;
      imgOverlay.style.width = `${percent}%`;
      sliderHandle.style.left = `${percent}%`;
    });
  </script>
</body>
  </html>
